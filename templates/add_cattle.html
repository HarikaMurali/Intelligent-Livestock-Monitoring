{% extends "base.html" %}
{% block title %}Add Cattle - AgriSaaS{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <div class="mb-4">
        <a href="{{ url_for('view_farm', farm_id=farm_id) }}" class="text-sm text-gray-500 hover:text-gray-800">&larr; Cancel and return to Farm</a>
    </div>

    <div class="bg-white p-8 rounded-xl border border-gray-100 shadow-sm">
        <h2 class="text-xl font-bold text-gray-900 mb-6">Register New Cattle</h2>

        <form method="POST" action="{{ url_for('add_cattle', farm_id=farm_id) }}" class="space-y-6">
            
            <!-- Section 1: Identification -->
            <div>
                <h3 class="text-sm font-bold text-gray-900 border-b pb-2 mb-4">Identification</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Cattle ID *</label>
                        <input type="text" name="cattle_id" required placeholder="e.g., C005" class="w-full px-4 py-2 border rounded-lg outline-none focus:border-agri-500 text-sm uppercase">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">RFID UID *</label>
                        <input type="text" name="rfid_uid" required placeholder="Hardware Tag ID" class="w-full px-4 py-2 border rounded-lg outline-none focus:border-agri-500 text-sm uppercase">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Given Name *</label>
                        <input type="text" name="name" required placeholder="e.g., Daisy" class="w-full px-4 py-2 border rounded-lg outline-none focus:border-agri-500 text-sm">
                    </div>
                </div>
            </div>

            <!-- Section 2: Biological Data -->
            <div>
                <h3 class="text-sm font-bold text-gray-900 border-b pb-2 mb-4 mt-6">Biological Details</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Breed *</label>
                        <input type="text" name="breed" required placeholder="e.g., Holstein" class="w-full px-4 py-2 border rounded-lg outline-none focus:border-agri-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Gender *</label>
                        <select name="gender" required class="w-full px-4 py-2 border rounded-lg outline-none focus:border-agri-500 text-sm bg-white">
                            <option value="female">Female (Cow/Heifer)</option>
                            <option value="male">Male (Bull/Steer)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Date of Birth</label>
                        <input type="date" name="date_of_birth" class="w-full px-4 py-2 border rounded-lg outline-none focus:border-agri-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Weight (kg)</label>
                        <input type="number" step="0.1" name="weight" placeholder="e.g., 450.5" class="w-full px-4 py-2 border rounded-lg outline-none focus:border-agri-500 text-sm">
                    </div>
                </div>
            </div>

            <!-- Section 3: Status -->
            <div>
                <h3 class="text-sm font-bold text-gray-900 border-b pb-2 mb-4 mt-6">Health & Status</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Initial Health Status</label>
                        <select name="health_status" class="w-full px-4 py-2 border rounded-lg outline-none focus:border-agri-500 text-sm bg-white">
                            <option value="healthy">Healthy</option>
                            <option value="sick">Sick / Under Observation</option>
                            <option value="injured">Injured</option>
                        </select>
                    </div>
                </div>
                <div class="mt-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">General Notes</label>
                    <textarea name="notes" rows="3" placeholder="Distinguishing marks, origin, etc." class="w-full px-4 py-2 border rounded-lg outline-none focus:border-agri-500 text-sm"></textarea>
                </div>
            </div>

            <div class="pt-4">
                <button type="submit" class="w-full bg-agri-600 text-white font-bold py-3 rounded-lg hover:bg-agri-700 transition-colors shadow-sm">
                    Save New Cattle
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
