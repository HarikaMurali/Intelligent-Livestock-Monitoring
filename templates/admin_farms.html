{% extends "base.html" %}
{% block title %}Manage Farms - Admin{% endblock %}

{% block content %}
<div class="mb-4">
    <a href="{{ url_for('admin_dashboard') }}" class="text-sm text-gray-500 hover:text-gray-800">&larr; Back to Dashboard</a>
</div>

<div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
    <!-- Add Farm Form -->
    <div class="col-span-1">
        <div class="bg-white p-6 rounded-xl border border-gray-100 shadow-sm">
            <h3 class="font-bold text-gray-900 mb-4">Create New Farm</h3>
            <form method="POST" action="{{ url_for('admin_farms') }}" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Farm ID (Unique)</label>
                    <input type="text" name="farm_id" required placeholder="e.g., F003" class="w-full px-4 py-2 border rounded-lg outline-none focus:border-agri-500 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Farm Name</label>
                    <input type="text" name="name" required class="w-full px-4 py-2 border rounded-lg outline-none focus:border-agri-500 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Location</label>
                    <input type="text" name="location" required class="w-full px-4 py-2 border rounded-lg outline-none focus:border-agri-500 text-sm">
                </div>
                <button type="submit" class="w-full bg-agri-600 text-white font-medium py-2 rounded-lg hover:bg-agri-700">Create Farm</button>
            </form>
        </div>
    </div>

    <!-- Farm List -->
    <div class="col-span-1 lg:col-span-2">
        <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
            <table class="w-full text-left text-sm">
                <thead>
                    <tr class="bg-gray-50 text-gray-500 border-b">
                        <th class="px-6 py-3 font-medium">Farm ID</th>
                        <th class="px-6 py-3 font-medium">Name</th>
                        <th class="px-6 py-3 font-medium">Location</th>
                        <th class="px-6 py-3 font-medium">Status</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-100">
                    {% for farm in farms %}
                    <tr class="hover:bg-gray-50">
                        <td class="px-6 py-4 font-mono text-gray-500">{{ farm.farm_id }}</td>
                        <td class="px-6 py-4 font-medium text-gray-900">{{ farm.name }}</td>
                        <td class="px-6 py-4 text-gray-600">{{ farm.location }}</td>
                        <td class="px-6 py-4">
                            <span class="px-2 py-1 rounded text-xs font-medium bg-green-100 text-green-800">Active</span>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
