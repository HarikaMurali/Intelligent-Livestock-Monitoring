{% extends "base.html" %}
{% block title %}Login - AgriSaaS{% endblock %}

{% block auth_content %}
<div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 max-w-md w-full my-auto">
    <div class="text-center mb-8">
        <div class="inline-flex bg-green-50 p-3 rounded-full text-brand-sidebar mb-3">
            <i class="ph ph-cow text-2xl text-agri-600"></i>
        </div>
        <h2 class="text-2xl font-bold text-gray-900">Welcome back</h2>
        <p class="text-sm text-gray-500 mt-1">Enter your credentials to access your dashboard.</p>
    </div>

    <form method="POST" action="{{ url_for('login') }}" class="space-y-4">
        <div>
            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
            <input type="email" name="email" id="email" required 
                class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-agri-500 focus:border-agri-500 outline-none text-sm"
                placeholder="farmer@farm.com">
        </div>

        <div>
            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input type="password" name="password" id="password" required 
                class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-agri-500 focus:border-agri-500 outline-none text-sm"
                placeholder="••••••••">
        </div>

        <button type="submit" 
            class="w-full bg-agri-600 hover:bg-agri-700 text-white font-semibold py-2.5 rounded-lg shadow-sm transition-colors duration-200 text-sm">
            Sign In
        </button>
    </form>
    
    <div class="mt-6 text-center text-sm text-gray-500 border-t border-gray-100 pt-4">
        Don't have an account? <a href="{{ url_for('register') }}" class="text-agri-600 hover:text-agri-700 font-semibold">Register here</a>
    </div>
</div>
{% endblock %}
