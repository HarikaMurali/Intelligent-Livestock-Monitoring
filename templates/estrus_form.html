{% extends "base.html" %}
{% block title %}Update Estrus - {{ cattle.name }}{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-4">
        <a href="{{ url_for('view_cattle', cattle_id=cattle.cattle_id) }}" class="text-sm text-gray-500 hover:text-gray-800">&larr; Cancel and return</a>
    </div>

    <div class="bg-white p-8 rounded-xl border border-gray-100 shadow-sm">
        <h2 class="text-xl font-bold text-gray-900 mb-6">Update Estrus Record for {{ cattle.name }}</h2>

        <form method="POST" action="{{ url_for('edit_estrus', cattle_id=cattle.cattle_id) }}" class="space-y-5">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Last Estrus Date</label>
                    <input type="date" name="last_estrus_date" value="{{ estrus.last_estrus_date if estrus else '' }}" required class="w-full px-4 py-2 border rounded-lg outline-none focus:border-agri-500 text-sm">
                </div>
                <div>
                    <!-- Set this to TOMORROW'S date to trigger the Alert banner! -->
                    <label class="block text-sm font-medium text-gray-700 mb-1">Expected Next Date</label>
                    <input type="date" name="expected_next_date" value="{{ estrus.expected_next_date if estrus else '' }}" required class="w-full px-4 py-2 border rounded-lg outline-none focus:border-agri-500 text-sm">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Cycle Length (Days)</label>
                    <input type="number" name="cycle_length_days" value="{{ estrus.cycle_length_days if estrus else '21' }}" required class="w-full px-4 py-2 border rounded-lg outline-none focus:border-agri-500 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Breeding/Mating Date</label>
                    <input type="date" name="breeding_date" value="{{ estrus.breeding_date if estrus else '' }}" class="w-full px-4 py-2 border rounded-lg outline-none focus:border-agri-500 text-sm">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Notes</label>
                <textarea name="notes" rows="3" class="w-full px-4 py-2 border rounded-lg outline-none focus:border-agri-500 text-sm">{{ estrus.notes if estrus else '' }}</textarea>
            </div>

            <button type="submit" class="w-full bg-agri-600 text-white font-medium py-2 rounded-lg hover:bg-agri-700">Save Record</button>
        </form>
    </div>
</div>
{% endblock %}
